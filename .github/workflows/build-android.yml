name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "Docs/**"
      - "**/*.pptx"
      - "**/*.html"
      - "**/*.py"
      - "swa_src/**"
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build. arm64-v8a covers every modern phone and is fastest; use all four for emulators / 32-bit devices."
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - arm64-v8a,armeabi-v7a,x86_64,x86

# A newer push on the same branch makes the older, still-running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve ABIs
        id: abis
        run: |
          abis="${{ github.event.inputs.abis || 'arm64-v8a' }}"
          targets=""
          for abi in ${abis//,/ }; do
            case "$abi" in
              arm64-v8a)   targets="$targets aarch64-linux-android" ;;
              armeabi-v7a) targets="$targets armv7-linux-androideabi" ;;
              x86_64)      targets="$targets x86_64-linux-android" ;;
              x86)         targets="$targets i686-linux-android" ;;
              *) echo "Unknown ABI: $abi" >&2; exit 1 ;;
            esac
          done
          echo "abis=$abis" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "ANDROID_ABIS=$abis" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle dependency + build-cache (only the default branch writes to it).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android SDK, platform 35, build-tools 35
      # and NDK 27; only install what is actually missing.
      - name: Ensure Android SDK packages
        run: |
          missing=()
          [ -d "$ANDROID_HOME/platforms/android-35" ]    || missing+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ]      || missing+=("build-tools;35.0.0")
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]        || missing+=("ndk;$NDK_VERSION")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing: ${missing[*]}"
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "${missing[@]}"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.abis.outputs.targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/inward_core

      # Prebuilt binary instead of compiling cargo-ndk from source every run.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Make Gradle wrapper executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures=${{ steps.abis.outputs.abis }}
          --parallel --build-cache --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swa-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
