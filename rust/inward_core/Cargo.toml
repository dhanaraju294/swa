[package]
name = "inward_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "inward_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
uniffi = { version = "0.29", features = ["bindgen"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4"] }
time = { version = "0.3", features = ["macros", "formatting", "parsing", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions", "load_extension"] }
rusqlite_migration = "1.3"

[dev-dependencies]
tempfile = "3.19"

[features]
default = []
bundled-sqlcipher = ["rusqlite/bundled-sqlcipher"]

[build-dependencies]
uniffi = { version = "0.29", features = ["bindgen"] }
