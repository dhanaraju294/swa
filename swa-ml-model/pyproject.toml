[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swa-adaptive-engine"
version = "0.1.0"
description = "Phase 1 foundation for the SWA Adaptive Exercise and Personalization Engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "scikit-learn>=1.7.2,<1.9", "joblib>=1.3,<2", "fastapi>=0.100,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
