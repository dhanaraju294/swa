<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWA - 7 Day Action Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F9F7F1; --card: #FFFFFF; --plum: #2C2638; --grey: #827A90;
    --morning: #E27B58; --morning-soft: #FCEBE5;
    --evening: #5C6B9C; --evening-soft: #EAEFF8;
    --line: #E5E0DA; --success: #52B788;
    --shadow: 0 12px 32px rgba(44, 38, 56, 0.08);
  }
  * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
  body { background: var(--bg); color: var(--plum); margin: 0; padding: 20px 14px 80px; min-height: 100vh; transition: background 0.5s ease; }
  body.evening-mode { background: #E8E8EE; }
  
  .container { max-width: 460px; margin: 0 auto; }
  
  /* Top Navigation */
  .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .logo { font-weight: 900; font-size: 24px; letter-spacing: -1px; }
  .mode-badge { padding: 8px 16px; border-radius: 99px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; background: var(--morning); color: #fff; transition: 0.4s; cursor: pointer; box-shadow: var(--shadow);}
  body.evening-mode .mode-badge { background: var(--evening); }

  /* Day Selector */
  .day-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill { padding: 8px 16px; border-radius: 99px; background: var(--card); font-weight: 800; font-size: 13px; color: var(--grey); cursor: pointer; border: 2.5px solid var(--line); white-space: nowrap; transition: 0.2s;}
  .day-pill.active { background: var(--plum); color: #fff; border-color: var(--plum); }

  /* Progress Bar */
  .progress-wrap { height: 6px; background: var(--line); border-radius: 99px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: var(--morning); border-radius: 99px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  body.evening-mode .progress-bar { background: var(--evening); }

  /* Main Card */
  .screen { background: var(--card); border-radius: 28px; padding: 32px 24px; box-shadow: var(--shadow); position: relative; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .kicker { font-size: 13px; font-weight: 800; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
  .prompt { font-size: 22px; font-weight: 800; line-height: 1.35; margin: 0 0 24px; }

  /* --- INTERACTIVES --- */
  
  /* 1. Tap Grid (Single Select) */
  .tap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tap-card { background: #fff; border: 2.5px solid var(--line); border-radius: 18px; padding: 20px 12px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 8px; }
  .tap-card .emoji { font-size: 32px; }
  .tap-card .lbl { font-size: 14px; font-weight: 700; color: var(--plum); }
  .tap-card.selected { border-color: var(--morning); background: var(--morning-soft); transform: translateY(-4px); box-shadow: 0 8px 16px rgba(226,123,88,0.15); }
  body.evening-mode .tap-card.selected { border-color: var(--evening); background: var(--evening-soft); box-shadow: 0 8px 16px rgba(92,107,156,0.15); }

  /* 2. Multi-Tap Chips (Multiple Select) */
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 12px 18px; border-radius: 14px; border: 2.5px solid var(--line); background: #fff; font-size: 15px; font-weight: 700; color: var(--grey); cursor: pointer; transition: 0.2s; }
  .chip.selected { background: var(--morning); border-color: var(--morning); color: #fff; }
  body.evening-mode .chip.selected { background: var(--evening); border-color: var(--evening); }

  /* 3. Slider */
  .slider-wrap { margin: 20px 0; }
  input[type="range"] { width: 100%; appearance: none; height: 8px; background: var(--line); border-radius: 99px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--morning); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: 0.2s; }
  body.evening-mode input[type="range"]::-webkit-slider-thumb { background: var(--evening); }
  .slider-labels { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--grey); }
  .slider-value { text-align: center; font-size: 42px; margin-bottom: 16px; font-weight: 800; }

  /* 4. Text Area */
  textarea { width: 100%; border: 2.5px solid var(--line); border-radius: 18px; padding: 16px; font-size: 16px; font-weight: 600; min-height: 110px; resize: none; color: var(--plum); font-family: 'Nunito'; }
  textarea:focus { outline: none; border-color: var(--morning); }
  body.evening-mode textarea:focus { border-color: var(--evening); }
  textarea::placeholder { color: #B3AEBC; font-weight: 600; font-style: italic; }

  /* 5. Breathe Animation */
  .breathe-circle { width: 140px; height: 140px; border-radius: 50%; background: var(--morning-soft); margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: var(--morning); box-shadow: 0 0 0 0 rgba(226,123,88,0.4); }
  body.evening-mode .breathe-circle { background: var(--evening-soft); color: var(--evening); box-shadow: 0 0 0 0 rgba(92,107,156,0.4); }
  .breathe-circle.animate { animation: breatheInOut 8s infinite ease-in-out; }
  @keyframes breatheInOut {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(226,123,88,0.4); }
    50% { transform: scale(1.4); box-shadow: 0 0 0 30px rgba(226,123,88,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(226,123,88,0); }
  }

  /* 6. Spin Wheel */
  .spin-box { border: 3px dashed var(--line); border-radius: 20px; padding: 24px; text-align: center; font-size: 18px; font-weight: 800; min-height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--grey); background: #fff; }
  .spin-active { color: var(--morning); transform: scale(1.05); transition: 0.1s; }
  body.evening-mode .spin-active { color: var(--evening); }
  
  /* Nav Buttons */
  .nav-row { display: flex; justify-content: space-between; margin-top: 32px; gap: 12px; }
  .btn { padding: 16px 24px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; flex: 1; border: none; }
  .btn-ghost { background: transparent; color: var(--grey); border: 2.5px solid var(--line); flex: 0.5; }
  .btn-primary { background: var(--morning); color: #fff; box-shadow: 0 6px 16px rgba(226, 123, 88, 0.25); }
  body.evening-mode .btn-primary { background: var(--evening); box-shadow: 0 6px 16px rgba(92, 107, 156, 0.25); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn:active:not(:disabled) { transform: scale(0.97); }

  /* End Screen Insight */
  .insight-box { background: var(--morning-soft); border-radius: 16px; padding: 20px; border-left: 4px solid var(--morning); margin-top: 20px; }
  body.evening-mode .insight-box { background: var(--evening-soft); border-left-color: var(--evening); }
  .insight-box h4 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--morning); }
  body.evening-mode .insight-box h4 { color: var(--evening); }
  .insight-box p { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.6; color: var(--plum); }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <div class="logo">SWA.</div>
    <div class="mode-badge" id="modeToggle">Morning</div>
  </div>

  <div class="day-scroll" id="daySelector">
    <!-- Generated via JS -->
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progBar"></div>
  </div>

  <div class="screen" id="appScreen">
    <!-- Generated via JS -->
  </div>
</div>

<script>
/* =========================================================
   7-DAY ACTION & BEHAVIORAL PRACTICE LIBRARY
   ========================================================= */
const weekData = [
  // --- DAY 1: The Friction Finder ---
  {
    day: 1, 
    morning: [
      { step: 1, type: "slider", kicker: "Current State", q: "How much mental energy do you have today?", min: "Empty", max: "Fully Charged", emoji: ["🪫","🔋"] },
      { step: 2, type: "tap", kicker: "Notice", q: "What is one task you've been avoiding?", opts: [["💼","Work/Study"],["🧹","Chores"],["💬","Hard Chat"],["🏃","Exercise"]] },
      { step: 3, type: "multitap", kicker: "Understand", q: "What usually makes it hard to start? (Select all that apply)", opts: ["I'm too tired", "It feels too big", "I get distracted", "I don't know the first step", "I'm afraid to fail"] },
      { step: 4, type: "breathe", kicker: "Regulate", q: "Before deciding what to do, take a slow breath.", seconds: 10, label: "Breathe" },
      { step: 5, type: "text", kicker: "Action Plan", q: "How can you make the very first step 50% smaller today?", placeholder: "e.g., Instead of cleaning the whole room, I will just put away 3 items." },
      { step: 6, type: "info", kicker: "Intention Set", q: "Experiment Ready", insightTitle: "The Science of Starting", insightText: "When a task feels too big, the brain avoids it to save energy. By shrinking the task by 50%, you trick your brain into feeling safe enough to begin." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did you take that smaller first step today?", opts: [["✅","Yes, I did"],["🛑","Not today"],["🔄","Started but stopped"]] },
      { step: 2, type: "slider", kicker: "Evaluate Reaction", q: "How much resistance did you actually feel when you started?", min: "None at all", max: "Felt impossible", emoji: ["🍃","🧱"] },
      { step: 3, type: "multitap", kicker: "Metacognition", q: "If you avoided it again, what got in the way?", opts: ["Forgot about it", "Got too busy", "Still felt too big", "Energy crashed", "I just didn't want to"] },
      { step: 4, type: "text", kicker: "Learning", q: "What did today teach you about how you start things?", placeholder: "e.g., I realized that once I actually sit down, it's not that bad." },
      { step: 5, type: "info", kicker: "Day Complete", q: "Data Gathered", insightTitle: "Updating Expectations", insightText: "We often predict a task will be much harder than it actually is. Noticing this difference trains your brain to hesitate less tomorrow." }
    ]
  },
  // --- DAY 2: The Backup Plan ---
  {
    day: 2,
    morning: [
      { step: 1, type: "tap", kicker: "Current State", q: "What is your main mood right now?", opts: [["😌","Calm"],["🌪️","Anxious"],["🚀","Driven"],["🌫️","Foggy"]] },
      { step: 2, type: "text", kicker: "Goal", q: "What is one thing you really want to do today?", placeholder: "e.g., Go for a 20-minute walk after work." },
      { step: 3, type: "spin", kicker: "Predict", q: "Spin to identify a common everyday obstacle:", opts: ["Your phone distracts you", "You feel suddenly tired", "Someone asks for your time", "You lose track of time", "You feel unmotivated"] },
      { step: 4, type: "text", kicker: "Action Plan", q: "Create a Backup Plan for that obstacle: IF [obstacle happens], THEN I will...", placeholder: "e.g., IF I feel unmotivated, THEN I will just put my shoes on and stand outside." },
      { step: 5, type: "info", kicker: "Intention Set", q: "Plan Pre-Loaded", insightTitle: "Automating Decisions", insightText: "You just linked a specific obstacle to a specific action. You no longer need willpower; the obstacle itself becomes the reminder to act." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did your predicted obstacle show up today?", opts: [["👾","Yes, right on time"],["🕊️","No, stayed clear"]] },
      { step: 2, type: "tap", kicker: "Reaction", q: "Did your Backup Plan help you react differently?", opts: [["🛡️","Yes, it saved me"],["📉","Forgot to use it"],["🧱","Used it, didn't work"]] },
      { step: 3, type: "text", kicker: "Reframe", q: "If your plan failed, why? Was the action too hard?", placeholder: "e.g., Putting my shoes on was easy, but it was too cold outside to walk." },
      { step: 4, type: "info", kicker: "Day Complete", q: "Learning Logged", insightTitle: "Troubleshooting Behavior", insightText: "A failed backup plan isn't a lack of discipline; it's just missing information. You now know exactly where the plan broke down." }
    ]
  },
  // --- DAY 3: The 2-Minute Prototype ---
  {
    day: 3,
    morning: [
      { step: 1, type: "slider", kicker: "Current State", q: "How motivated do you feel today?", min: "Zero Drive", max: "Ready to Go", emoji: ["🧊","🔥"] },
      { step: 2, type: "tap", kicker: "Notice", q: "Pick an area where you want to build a better habit:", opts: [["💧","Hydration"],["🧘","Mindfulness"],["🏃","Movement"],["📖","Reading"]] },
      { step: 3, type: "breathe", kicker: "Visualize", q: "Close your eyes. Imagine the BEST feeling of finishing that habit.", seconds: 12, label: "Visualize" },
      { step: 4, type: "text", kicker: "Action Plan", q: "What is the 2-minute version of that habit?", placeholder: "e.g., Instead of a 30-min workout, I will do 2 minutes of stretching." },
      { step: 5, type: "info", kicker: "Intention Set", q: "The 2-Minute Rule", insightTitle: "Overcoming Inertia", insightText: "An object at rest stays at rest. The hardest part is simply starting. Two minutes is all it takes to break the inertia." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did you complete your 2-minute version today?", opts: [["✅","Yes"],["❌","Not today"]] },
      { step: 2, type: "multitap", kicker: "Evaluate Reaction", q: "Once you started, what happened? (Select all that apply)", opts: ["I stopped exactly at 2 minutes", "I kept going longer", "It felt easier than expected", "It felt pointless", "I felt proud"] },
      { step: 3, type: "text", kicker: "Learning", q: "What did this teach you about the relationship between motivation and starting?", placeholder: "e.g., I don't need to feel motivated to start; starting creates the motivation." },
      { step: 4, type: "info", kicker: "Day Complete", q: "Momentum Built", insightTitle: "Action Precedes Feeling", insightText: "We often wait to feel motivated before acting. In reality, taking a tiny action is what generates the feeling of motivation." }
    ]
  },
  // --- DAY 4: The Minimum Viable Day ---
  {
    day: 4,
    morning: [
      { step: 1, type: "slider", kicker: "Current State", q: "How busy does today feel?", min: "Wide Open", max: "Overwhelming", emoji: ["🏖️","🌪️"] },
      { step: 2, type: "text", kicker: "Focus", q: "If you could only accomplish ONE thing today, what would it be?", placeholder: "e.g., Sending that one important email." },
      { step: 3, type: "multitap", kicker: "Understand", q: "What usually distracts you from your main priority?", opts: ["Social Media", "Other people's requests", "Overthinking", "Doing easier tasks first", "Perfectionism"] },
      { step: 4, type: "spin", kicker: "Action Plan", q: "Spin for a boundary you will set today:", opts: ["Put phone in another room for 1 hour", "Say 'no' to one request", "Close all extra browser tabs", "Work for 15 mins before checking email"] },
      { step: 5, type: "info", kicker: "Intention Set", q: "Focus Protected", insightTitle: "Setting the Standard", insightText: "By identifying your single priority and a boundary to protect it, you shift from reacting to the day, to actively directing it." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did you complete your ONE priority today?", opts: [["🏆","Yes, got it done"],["🔄","Rolled to tomorrow"]] },
      { step: 2, type: "slider", kicker: "Evaluate Reaction", q: "How well did you protect your boundary?", min: "Terribly", max: "Perfectly", emoji: ["🛡️","🏰"] },
      { step: 3, type: "text", kicker: "Learning", q: "How did it feel to have one clear priority instead of a massive list?", placeholder: "e.g., It felt less overwhelming, even though I was busy." },
      { step: 4, type: "info", kicker: "Day Complete", q: "Clarity Gained", insightTitle: "The Power of Less", insightText: "When everything is important, nothing is. Limiting your focus teaches you how to direct your energy where it matters most." }
    ]
  },
  // --- DAY 5: Environment Design ---
  {
    day: 5,
    morning: [
      { step: 1, type: "tap", kicker: "Current State", q: "How is your physical environment affecting you right now?", opts: [["✨","Calming"],["📦","Cluttered"],["🏢","Distracting"],["🛌","Too comfortable"]] },
      { step: 2, type: "text", kicker: "Notice", q: "What is a good habit you want to do today?", placeholder: "e.g., Drink more water." },
      { step: 3, type: "spin", kicker: "Action Plan", q: "Spin to alter your physical space right now:", opts: ["Put a glass of water on your desk", "Hide your phone out of sight", "Put your workout shoes by the door", "Clear your workspace for 1 min"] },
      { step: 4, type: "breathe", kicker: "Regulate", q: "Take a breath and commit to leaving that environmental tweak in place.", seconds: 8, label: "Breathe" },
      { step: 5, type: "info", kicker: "Intention Set", q: "Space Adjusted", insightTitle: "Invisible Influence", insightText: "Willpower is unreliable. The most effective way to change a behavior is to change the physical environment that surrounds it." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did changing your environment help you act?", opts: [["✅","Yes, it acted as a cue"],["❌","Didn't make a difference"]] },
      { step: 2, type: "multitap", kicker: "Metacognition", q: "When you look around your room/desk right now, what behaviors is it encouraging?", opts: ["Relaxing/Sleeping", "Focus/Working", "Distraction/Scrolling", "Eating/Snacking", "Creativity"] },
      { step: 3, type: "text", kicker: "Learning", q: "How can you arrange your space tomorrow to make your goals easier?", placeholder: "e.g., I'll leave my book on my pillow so I read before sleeping." },
      { step: 4, type: "info", kicker: "Day Complete", q: "Environment Logged", insightTitle: "Designing Default Choices", insightText: "Your space dictates your default actions. If you want to change what you do, change what is easiest to reach." }
    ]
  },
  // --- DAY 6: The Energy Check ---
  {
    day: 6,
    morning: [
      { step: 1, type: "slider", kicker: "Current State", q: "How much patience do you have today?", min: "Very Little", max: "A Lot", emoji: ["🧨","🌊"] },
      { step: 2, type: "text", kicker: "Notice", q: "What usually happens when your energy crashes?", placeholder: "e.g., I get snappy, or I scroll on my phone for hours." },
      { step: 3, type: "multitap", kicker: "Action Plan", q: "What is your 'Low-Battery' routine? (Select your fail-safes)", opts: ["Say 'I need 10 mins'", "Drink a glass of water", "Do zero-effort stretching", "Listen to calm music", "Cancel non-essentials"] },
      { step: 4, type: "breathe", kicker: "Regulate", q: "I give myself permission to rest if I need to.", seconds: 10, label: "Acceptance" },
      { step: 5, type: "info", kicker: "Intention Set", q: "Fail-Safe Ready", insightTitle: "Protecting the Baseline", insightText: "Having a pre-planned 'low-battery' routine prevents a bad moment from turning into a bad day. It’s a safety net for your energy." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did you hit a low-energy wall today?", opts: [["🧱","Yes, I crashed"],["🔋","No, stayed steady"]] },
      { step: 2, type: "slider", kicker: "Evaluate Reaction", q: "If you crashed, how well did you handle it compared to normal?", min: "Worse", max: "Much Better", emoji: ["📉","📈"] },
      { step: 3, type: "text", kicker: "Learning", q: "What does your body actually need when you hit that wall?", placeholder: "e.g., I don't need caffeine, I usually just need silence and air." },
      { step: 4, type: "info", kicker: "Day Complete", q: "Energy Mapped", insightTitle: "Listening to the Signal", insightText: "Fatigue isn't a weakness; it's data. Planning for it allows you to recover faster without guilt." }
    ]
  },
  // --- DAY 7: Weekly Integration ---
  {
    day: 7,
    morning: [
      { step: 1, type: "slider", kicker: "Current State", q: "Looking back at the week, how much in control do you feel?", min: "Lost", max: "In Control", emoji: ["🍂","⚓"] },
      { step: 2, type: "multitap", kicker: "Review", q: "Which tools helped you actually take action this week? (Select all)", opts: ["Shrinking tasks by 50%", "If-Then Backup Plans", "The 2-Minute Rule", "Environment tweaks", "Low-battery routines"] },
      { step: 3, type: "text", kicker: "Action Plan", q: "Which tool will you use today?", placeholder: "e.g., I'll use the 2-minute rule to start my assignment." },
      { step: 4, type: "breathe", kicker: "Regulate", q: "Breathe in your progress. You are building new systems.", seconds: 12, label: "Breathe" },
      { step: 5, type: "info", kicker: "Intention Set", q: "Toolkit Assembled", insightTitle: "You Are the Architect", insightText: "You now have a toolkit to break down any goal. When you get stuck, you don't need to try harder—you just need to use the right tool." }
    ],
    evening: [
      { step: 1, type: "tap", kicker: "Reality Check", q: "Did you use your chosen tool today?", opts: [["✅","Yes, I did"],["❌","Forgot to use it"]] },
      { step: 2, type: "slider", kicker: "Evaluate Progress", q: "Compared to Day 1, how much easier is it to start a task?", min: "Same", max: "Much Easier", emoji: ["➖","🚀"] },
      { step: 3, type: "text", kicker: "Final Reflection", q: "What is your biggest realization about your own behavior this week?", placeholder: "e.g., I learned that friction stops me, not laziness." },
      { step: 4, type: "info", kicker: "Week Complete", q: "Action Engine Mapped", insightTitle: "The Journey Continues", insightText: "You have moved from just thinking about your habits to actively experimenting with them. Carry this mindset into everything you do." }
    ]
  }
];

// App State
let currentDayIdx = 0; 
let isEvening = false;
let currentStepIdx = 0;
let sessionData = {}; // Stores temporary answers

// DOM Elements
const DOM = {
  screen: document.getElementById('appScreen'),
  modeToggle: document.getElementById('modeToggle'),
  progBar: document.getElementById('progBar'),
  daySel: document.getElementById('daySelector'),
  body: document.body
};

// Build Day Selector
function buildDaySelector() {
  DOM.daySel.innerHTML = '';
  weekData.forEach((d, i) => {
    const pill = document.createElement('div');
    pill.className = `day-pill ${i === currentDayIdx ? 'active' : ''}`;
    pill.textContent = `Day ${d.day}`;
    pill.onclick = () => { 
      currentDayIdx = i; 
      currentStepIdx = 0; 
      sessionData = {};
      buildDaySelector(); 
      renderStep(); 
    };
    DOM.daySel.appendChild(pill);
  });
}

// Mode Switcher
DOM.modeToggle.onclick = () => {
  isEvening = !isEvening;
  DOM.body.classList.toggle('evening-mode', isEvening);
  DOM.modeToggle.textContent = isEvening ? "Evening Reflection" : "Morning Intention";
  currentStepIdx = 0;
  sessionData = {};
  renderStep();
};

function renderStep() {
  const session = isEvening ? weekData[currentDayIdx].evening : weekData[currentDayIdx].morning;
  const step = session[currentStepIdx];
  const isLast = currentStepIdx === session.length - 1;
  
  // Update Progress
  DOM.progBar.style.width = `${((currentStepIdx + 1) / session.length) * 100}%`;

  let html = `
    <span class="kicker">${step.kicker}</span>
    <h2 class="prompt">${step.q}</h2>
  `;

  // Render Interactives
  if (step.type === "tap") {
    const cards = step.opts.map((opt, i) => `
      <div class="tap-card" data-idx="${i}">
        <span class="emoji">${opt[0]}</span>
        <span class="lbl">${opt[1]}</span>
      </div>
    `).join('');
    html += `<div class="tap-grid">${cards}</div>`;
  } 
  else if (step.type === "multitap") {
    const chips = step.opts.map((opt, i) => `
      <div class="chip" data-idx="${i}">${opt}</div>
    `).join('');
    html += `<div class="chip-wrap">${chips}</div>`;
  }
  else if (step.type === "slider") {
    html += `
      <div class="slider-wrap">
        <div class="slider-value" id="slVal">5</div>
        <input type="range" id="slInput" min="1" max="10" value="5">
        <div class="slider-labels">
          <span>${step.min}</span>
          <span>${step.max}</span>
        </div>
      </div>
    `;
  }
  else if (step.type === "text") {
    html += `<textarea id="txtInput" placeholder="${step.placeholder || 'Type here...'}"></textarea>`;
  }
  else if (step.type === "breathe") {
    html += `
      <div class="breathe-circle" id="breatheUI">${step.label}</div>
      <button class="btn btn-primary" id="btnStartAnim" style="width:100%">Start Exercise</button>
    `;
  }
  else if (step.type === "spin") {
    html += `
      <div class="spin-box" id="spinRes">Tap to spin for a random option</div>
      <button class="btn btn-primary" id="btnSpin" style="width:100%">Spin 🎲</button>
    `;
  }
  else if (step.type === "info") {
    html += `
      <div style="font-size:48px; text-align:center; margin:20px 0;">✨</div>
      <div class="insight-box">
        <h4>${step.insightTitle}</h4>
        <p>${step.insightText}</p>
      </div>
    `;
  }

  // Navigation
  html += `
    <div class="nav-row">
      ${currentStepIdx > 0 ? `<button class="btn btn-ghost" id="btnBack">Back</button>` : '<div></div>'}
      ${step.type !== 'info' ? `<button class="btn btn-primary" id="btnNext" disabled>Next</button>` : `<button class="btn btn-primary" id="btnNext">Finish Session</button>`}
    </div>
  `;

  DOM.screen.innerHTML = html;
  bindEvents(step, isLast);
}

function bindEvents(step, isLast) {
  const next = document.getElementById('btnNext');
  
  if (step.type === "tap") {
    document.querySelectorAll('.tap-card').forEach(c => {
      c.onclick = () => {
        document.querySelectorAll('.tap-card').forEach(b => b.classList.remove('selected'));
        c.classList.add('selected');
        next.disabled = false;
      };
    });
  } 
  else if (step.type === "multitap") {
    let selectedCount = 0;
    document.querySelectorAll('.chip').forEach(c => {
      c.onclick = () => {
        c.classList.toggle('selected');
        selectedCount = document.querySelectorAll('.chip.selected').length;
        next.disabled = selectedCount === 0;
      };
    });
  }
  else if (step.type === "slider") {
    const sl = document.getElementById('slInput');
    const val = document.getElementById('slVal');
    next.disabled = false; 
    sl.oninput = () => { 
      if(step.emoji) {
        val.textContent = sl.value < 4 ? step.emoji[0] : (sl.value > 7 ? step.emoji[1] : '😐');
      } else {
        val.textContent = sl.value; 
      }
    };
  }
  else if (step.type === "text") {
    const txt = document.getElementById('txtInput');
    txt.oninput = () => { next.disabled = txt.value.trim().length < 4; };
  }
  else if (step.type === "breathe") {
    const btnAnim = document.getElementById('btnStartAnim');
    const circle = document.getElementById('breatheUI');
    btnAnim.onclick = () => {
      btnAnim.disabled = true;
      circle.classList.add('animate');
      circle.textContent = "Inhale...";
      setTimeout(() => { circle.textContent = "Exhale..."; }, 4000);
      
      setTimeout(() => {
        circle.classList.remove('animate');
        circle.textContent = "Done.";
        next.disabled = false;
        next.textContent = "Continue";
      }, step.seconds * 1000);
    };
  }
  else if (step.type === "spin") {
    const btnSpin = document.getElementById('btnSpin');
    const res = document.getElementById('spinRes');
    btnSpin.onclick = () => {
      btnSpin.disabled = true;
      let ticks = 0;
      const maxTicks = 12;
      const interval = setInterval(() => {
        res.textContent = step.opts[ticks % step.opts.length];
        ticks++;
        if (ticks > maxTicks) {
          clearInterval(interval);
          const finalVal = step.opts[Math.floor(Math.random() * step.opts.length)];
          res.innerHTML = `<span class="spin-active">${finalVal}</span>`;
          next.disabled = false;
        }
      }, 120);
    };
  }

  if(next) {
    next.onclick = () => {
      if (isLast) {
        DOM.screen.innerHTML = `
          <h2 class="prompt" style="text-align:center; margin-top:40px;">Session Complete</h2>
          <p style="text-align:center; color:var(--grey);">Your responses have been recorded for your journey.</p>
          <div style="text-align:center; font-size:48px; margin:20px 0;">🏆</div>
        `;
      } else {
        currentStepIdx++;
        renderStep();
      }
    };
  }

  const back = document.getElementById('btnBack');
  if (back) back.onclick = () => { currentStepIdx--; renderStep(); };
}

// Init App
buildDaySelector();
renderStep();
</script>
</body>
</html>
