<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWA — Action & Behavioral Practice (Week 4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6EC;
    --sky:#7ec8e3; --sky-soft:#EAF5F9;
    --sage:#8fbf8f; --sage-soft:#F1F7EF;
    --lavender:#c3a6e0; --lavender-soft:#F3EEF9;
    --gold:#f5b942; --gold-soft:#FBF1DE;
    --peach:#ee8e7b; --peach-soft:#FBEFEC;
    --ink:#3A3A3A; --ink-soft:#6b6560;
    --shadow:0 8px 24px rgba(58,58,58,0.08);
    --shadow-lift:0 14px 34px rgba(58,58,58,0.14);
    --r-lg:26px; --r-md:20px; --r-sm:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#e7e2d8;font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);padding:18px 14px 60px;min-height:100vh;}
  .container{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .screen{background:var(--cream);border-radius:var(--r-lg);padding:28px 22px;box-shadow:var(--shadow-lift);position:relative;overflow:hidden;animation:rise .35s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;color:var(--ink);font-weight:600;}
  p{margin:0;}
  .eyebrow{font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:11px;color:var(--ink-soft);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .screen-title{font-size:21px;line-height:1.3;margin-bottom:10px;}
  .prog-label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .gentle{background:#fff;border-radius:var(--r-sm);padding:11px 14px;margin-bottom:16px;border-left:4px solid var(--accent,#7ec8e3);font-size:13px;color:var(--ink-soft);line-height:1.5;box-shadow:var(--shadow);}

  .option-btn{background:#fff;border:2px solid transparent;border-radius:var(--r-sm);padding:15px 18px;font-size:15px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);margin-bottom:11px;cursor:pointer;transition:.15s ease;display:block;width:100%;text-align:left;font-family:'Nunito',sans-serif;line-height:1.35;}
  .option-btn:hover{border-color:var(--accent,#7ec8e3);transform:translateY(-2px);}
  .option-btn.selected{border-color:var(--accent,#7ec8e3);background:var(--soft,#EAF5F9);box-shadow:var(--shadow-lift);}
  .option-btn .check{float:right;opacity:0;font-weight:800;}
  .option-btn.selected .check{opacity:1;}

  .scale-row{display:flex;justify-content:space-between;gap:8px;margin:18px 0 8px;}
  .scale-btn{flex:1;max-width:58px;aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s ease;color:var(--ink);}
  .scale-btn:hover{border-color:var(--accent,#7ec8e3);}
  .scale-btn.selected{background:var(--accent,#7ec8e3);color:#fff;transform:scale(1.08);box-shadow:var(--shadow-lift);}
  .scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-weight:600;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
  .btn{border:none;border-radius:var(--r-sm);padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:.18s ease;box-shadow:var(--shadow);}
  .btn-primary{background:var(--ink);color:#fff;flex:1;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:var(--shadow);}
  .btn-ghost{background:transparent;box-shadow:none;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-accent{background:var(--accent,#7ec8e3);color:var(--ink);flex:1;}
  .btn-accent:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}

  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:46px;height:46px;border-radius:15px;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
  .app-name{font-family:'Fraunces',serif;font-weight:700;font-size:23px;}
  
  .stats{display:flex;gap:10px;margin-top:12px;}
  .stat{flex:1;background:#fff;border-radius:var(--r-md);padding:10px;text-align:center;box-shadow:var(--shadow);}
  .stat b{display:block;font-size:20px;}
  .stat span{font-size:11px;font-weight:700;color:var(--ink-soft);}

  .journey{position:relative;padding-left:8px;}
  .leg{display:flex;align-items:flex-start;gap:14px;position:relative;padding-bottom:6px;}
  .leg::before{content:'';position:absolute;left:21px;top:40px;bottom:-6px;width:3px;background:#e0d8c8;border-radius:2px;}
  .leg:last-child::before{display:none;}
  .node{width:44px;height:44px;border-radius:50%;flex:none;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;position:relative;z-index:1;color:var(--ink-soft);}
  .node.done{background:var(--accent,#7ec8e3);color:#fff;}
  .node.now{background:var(--ink);color:#fff;box-shadow:0 0 0 5px rgba(58,58,58,.12);}
  .leginfo{flex:1;background:#fff;border-radius:var(--r-md);padding:11px 14px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;}
  .leginfo:hover{border-color:var(--accent,#7ec8e3);}
  .leg-title{font-weight:800;font-size:14px;}
  .leg-sub{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .leg-tag{display:inline-block;background:var(--soft,#EAF5F9);border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;margin-top:6px;}

  .insight-card{background:linear-gradient(180deg,#fff 0%,var(--soft,#EAF5F9) 130%);border-radius:var(--r-md);padding:22px;border:2px solid var(--accent,#7ec8e3);}
  .insight-title{font-family:'Fraunces',serif;font-size:21px;font-weight:700;margin-bottom:10px;}
  .insight-text{font-size:15px;color:var(--ink);line-height:1.55;}
  .insight-text b{color:var(--ink);}
  .divider{border-top:1px solid var(--accent,#7ec8e3);margin:18px 0;opacity:.6;}
  .center{text-align:center;}
  .celebrate{text-align:center;font-family:'Caveat',cursive;font-size:26px;color:var(--ink);}
  .xpfloat{position:absolute;right:14px;top:14px;background:var(--gold);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;box-shadow:var(--shadow);}
  
  .interactive-box{background:#fff;border-radius:var(--r-sm);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;}
  .spin-btn{background:var(--ink);color:#fff;border:none;border-radius:99px;padding:10px 20px;font-weight:800;cursor:pointer;font-family:'Nunito';margin-top:8px;}
  .timer-display{font-size:36px;font-weight:800;font-family:'Fraunces';margin:10px 0;}
  textarea.custom-input{width:100%;background:#fff;border:2px solid var(--line,#e0d8c8);border-radius:var(--r-sm);padding:12px;font-family:'Nunito';font-size:14px;color:var(--ink);resize:none;height:80px;box-shadow:var(--shadow);margin-top:8px;}
  textarea.custom-input:focus{outline:none;border-color:var(--accent);}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const STORE_KEY='swa_week4_micro_only_v1';

const WEEK_DATA = [
  {
    theme: "The Friction Finder", sub: "Making the first step much easier", icon: "🔬", accent: "#7ec8e3", soft: "#EAF5F9",
    gentle: "No right answers here — just noticing what makes starting hard.",
    qs: [
      {type:'SL', low:'Exhausted', high:'Energized', text:'Right now, how much physical and mental energy do you have available?'},
      {type:'SC', text:'What is one task or goal you have been quietly putting off today?', options:['A study or work assignment','A household chore','A difficult conversation','A health or movement habit']},
      {type:'MS', text:'When you think about starting it, what gets in your way? (pick all that apply)', options:['It feels too big to tackle','I do not know the exact first step','I am waiting to feel motivated','I am afraid it will take too long']},
      {type:'TF', text:'I believe I need to feel fully ready before I can begin a difficult task.'},
      {type:'SC', text:'How can you make that task much smaller right now so it feels super easy?', options:['Do just 2 minutes of it','Write down only the first step','Clear my desk space first','Open just the document or app']},
      {type:'RK', text:'Your anchor for today: What is the absolute smallest action you will permit yourself to start with?'}
    ]
  },
  {
    theme: "The Backup Plan", sub: "Pre-loading choices with IF-THEN", icon: "🚧", accent: "#8fbf8f", soft: "#F1F7EF",
    gentle: "Planning ahead helps you stay calm when distractions pop up.",
    qs: [
      {type:'SL', low:'Autopilot', high:'Intentional', text:'How deliberate do you feel about how you will spend your time today?'},
      {type:'SC', text:'What is the most likely distraction that will get in your way today?', options:['Sudden fatigue or low energy','Digital distractions or phone loops','Unexpected interruptions from others','Procrastination on hard items']},
      {type:'SPIN', text:'Tap to reveal a common hidden distraction:', options:['Checking notifications first thing','Transitioning between tasks','Saying yes to minor requests','Sitting down and losing momentum']},
      {type:'TF', text:'Willpower alone is usually enough to stop me from getting distracted.'},
      {type:'SC', text:'Create an IF-THEN plan for your main distraction. IF [distraction happens], THEN I will...', options:['IF I feel distracted, THEN I will put my phone in another room for 20 mins','IF I feel tired, THEN I will take a 5-minute stretch break before quitting','IF I am interrupted, THEN I will write down where I left off and pause','I want to type my own custom IF-THEN plan']},
      {type:'RK', text:'Commitment check: How confident are you that you can test this backup plan today?'}
    ]
  },
  {
    theme: "The 2-Minute Prototype", sub: "Beating getting stuck", icon: "⏱️", accent: "#f5b942", soft: "#FBF1DE",
    gentle: "Lowering the bar makes starting effortless.",
    qs: [
      {type:'SL', low:'Resistant', high:'Eager', text:'How does your body feel about the tasks waiting for you today?'},
      {type:'SC', text:'What habit or goal have you been delaying because it feels too time-consuming?', options:['Exercise or physical stretching','Deep studying or coding','Writing or creative work','Organizing or cleaning']},
      {type:'TF', text:'If an activity cannot be done thoroughly, it is not worth doing at all.'},
      {type:'SC', text:'What is a super quick, 2-minute version of that goal?', options:['Put on workout shoes and stretch for 120 seconds','Open a blank page and write 3 sentences','Review flashcards for exactly 2 minutes','Wipe down one single surface']},
      {type:'TIMER', text:'Take 60 seconds right now to visualize doing just that 2-minute version.'},
      {type:'RK', text:'Your rule for today: You only commit to 2 minutes. What happens after is bonus.'}
    ]
  },
  {
    theme: "The Minimum Viable Day", sub: "Protecting essential priorities", icon: "🎯", accent: "#c3a6e0", soft: "#F3EEF9",
    gentle: "Protecting what matters most requires letting go of minor demands.",
    qs: [
      {type:'SL', low: 'Scattered', high: 'Laser-focused', text:'How clear are your priorities as you step into today?'},
      {type:'SC', text:'What is the SINGLE most meaningful outcome you want to produce today?', options:['Finishing a core milestone project','Protecting time for personal well-being','Clearing a heavy mental backlog','Having a meaningful connection or conversation']},
      {type:'MS', text:'What usually steals your focus away from your main priority? (pick all that apply)', options:['Low-value busywork and emails','Immediate demands from others','Multitasking across too many apps','Self-doubt and overthinking']},
      {type:'TF', text:'Doing more things at once makes me more productive.'},
      {type:'SC', text:'What simple boundary will you set today to protect your priority?', options:['Turn off notifications for 2 hours','Say no to one non-essential request','Complete the hardest task before checking messages','Work in a single isolated browser window']},
      {type:'RK', text:'Your focus declaration: State your non-negotiable anchor for today.'}
    ]
  },
  {
    theme: "Environment Design", sub: "Shaping cues and surroundings", icon: "🪴", accent: "#ee8e7b", soft: "#FBEFEC",
    gentle: "Your surroundings shape your habits more than sheer willpower does.",
    qs: [
      {type:'SL', low:'Chaotic space', high:'Optimized space', text:'How supportive is your current physical or digital workspace for your goals?'},
      {type:'SC', text:'What habit do you want to make much easier to trigger today?', options:['Drinking more water or staying hydrated','Reading or studying consistently','Stretching or moving your body','Reviewing notes or planning']},
      {type:'SPIN', text:'Tap to reveal a subtle space tweak:', options:['Place your water bottle directly on your keyboard','Hide your phone inside a drawer out of sight','Set out your study materials the night before','Clear all desktop icons into a single folder']},
      {type:'TF', text:'Relying on sheer willpower is more effective than changing my environment.'},
      {type:'SC', text:'What space setup will you install right now?', options:['Move the helper object into my direct line of sight','Remove a distraction from arm’s reach','Create a dedicated visual anchor for focus','Set a clean physical boundary']},
      {type:'RK', text:'Action commitment: Make that one physical change to your space right now.'}
    ]
  },
  {
    theme: "The Energy Check", sub: "Managing low-battery states safely", icon: "🔋", accent: "#7ec8e3", soft: "#EAF5F9",
    gentle: "Honoring fatigue prevents burnout and keeps momentum alive.",
    qs: [
      {type:'SL', low:'Low baseline', high:'High baseline', text:'What is your emotional and physical battery level entering today?'},
      {type:'SC', text:'When your energy crashes during the day, what is your default reaction?', options:['Mindless scrolling or binge-watching','Pushing through until burnout','Self-criticism for being slow','Isolating and cutting off communication']},
      {type:'TF', text:'Feeling tired or low energy means I am failing to manage my schedule.'},
      {type:'SC', text:'What is a gentle backup plan when you hit low battery?', options:['Step outside for 3 minutes of fresh air','Drink a full glass of water and stretch','Lie down with eyes closed for 5 minutes without screens','Do a brain dump list to clear mental noise']},
      {type:'TIMER', text:'Take 45 seconds right now to drop your shoulders, unclench your jaw, and breathe.'},
      {type:'RK', text:'Permission slip: I give myself permission to rest intelligently without guilt.'}
    ]
  },
  {
    theme: "Action Engine Integration", sub: "Synthesizing your behavioral toolkit", icon: "🌅", accent: "#f5b942", soft: "#FBF1DE",
    gentle: "Bring everything together into a simple, sustainable personal rhythm.",
    qs: [
      {type:'SL', low:'Uncertain', high:'Empowered', text:'How prepared do you feel to steer your actions intentionally this week?'},
      {type:'MS', text:'Which action tools resonated most with you across this week? (pick all that apply)', options:['Making tasks 50% easier (Friction Finder)','Pre-loading IF-THEN backup plans','The 2-minute starting rule','Protecting one single priority','Optimizing my workspace','Low-battery backup routines']},
      {type:'TF', text:'Behavior change is about building systems, not forcing willpower.'},
      {type:'SC', text:'Which specific tool will you deploy as your primary helper today?', options:['The 2-minute rule to beat procrastination','An IF-THEN plan for my main distraction','Making my hardest task much smaller','Protecting one non-negotiable priority']},
      {type:'SC', text:'What is the one situation today where you will test this tool?', options:['First thing in the morning work block','During afternoon energy slips','When starting an avoided task','When an unexpected distraction appears']},
      {type:'RK', text:'Your final intention: Write your core behavioral commitment for today.'}
    ]
  }
];

/* ================= APP STATE & LOGIC ================= */
let state = loadState();
function defaultState() {
  return { answers: {}, completed: {}, xp: 0, updated: 0 };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    return s && s.answers ? s : defaultState();
  } catch(e) { return defaultState(); }
}
function saveState() {
  state.updated = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let currentDay = 0;
let currentStep = 0;
let view = null; // null = home | {kind:'q', day} | {kind:'result', day}

function countDone() {
  return Object.values(state.completed).filter(Boolean).length;
}

function render() {
  if (view && view.kind === 'q') {
    renderQ(view.day, currentStep);
  } else if (view && view.kind === 'result') {
    renderResult(view.day);
  } else {
    renderHome();
  }
}

function renderHome() {
  const done = countDone();
  let legs = '';
  WEEK_DATA.forEach((d, i) => {
    const isdone = !!state.completed[i];
    const isNow = i === currentDay;
    const nodeCls = isdone ? 'done' : isNow ? 'now' : '';
    const stTxt = isdone ? 'Done' : isNow ? 'Ready' : 'Upcoming';
    
    legs += `<div class="leg">
      <div class="node ${nodeCls}" style="--accent:${d.accent}">${isdone ? '✓' : i+1}</div>
      <div class="leginfo" data-i="${i}" style="--accent:${d.accent};--soft:${d.soft};">
        <div class="leg-title">${d.icon} ${esc(d.theme)}</div>
        <div class="leg-sub">${esc(d.sub)}</div>
        <span class="leg-tag">${d.icon} Day ${i+1} · ${stTxt}</span>
      </div>
    </div>`;
  });

  $('#app').innerHTML = `
    <div class="screen">
      <div class="brand">
        <div class="logo">⚡</div>
        <span class="app-name">SWA Action Lab</span>
      </div>
      <div class="stats">
        <div class="stat"><b>${done}/7</b><span>Days Done</span></div>
        <div class="stat"><b>⭐ ${state.xp}</b><span>XP Signals</span></div>
        <div class="stat"><b>${Math.round(done/7*100)}%</b><span>Progress</span></div>
      </div>
    </div>
    <div class="screen" style="background:linear-gradient(180deg,#FDF6EC,#FBF1E1);">
      <div class="center">
        <div class="celebrate">${done === 0 ? 'Week 4: Action & Behavioral Practice' : 'Welcome back to your practice.'}</div>
        <p style="font-size:14px;color:var(--ink-soft);margin-top:6px;">6 micro-exercises per day. Tap any day below to begin your session.</p>
      </div>
    </div>
    <div class="screen">
      <div class="eyebrow">7-Day Journey Roadmap</div>
      <div class="journey">${legs}</div>
      <div class="divider"></div>
      <p class="meta">Every exercise takes under 90 seconds and requires minimal typing. No right or wrong answers — only useful behavioral signals.</p>
      <div style="text-align:center;margin-top:12px;"><button class="btn btn-ghost" id="resetBtn" style="font-size:12px;">Reset progress</button></div>
    </div>`;

  document.querySelectorAll('.leginfo').forEach(c => {
    c.onclick = () => {
      currentDay = +c.dataset.i;
      currentStep = 0;
      view = { kind: 'q', day: currentDay };
      render();
    };
  });

  const rb = $('#resetBtn');
  if(rb) rb.onclick = () => {
    if(confirm('Clear all progress and start over?')) {
      state = defaultState();
      saveState();
      render();
    }
  };
}

function renderQ(day, q) {
  const d = WEEK_DATA[day];
  const Q = d.qs[q];
  const total = d.qs.length;
  
  if(!state.answers[day]) state.answers[day] = {};
  const prev = state.answers[day][q];
  const isLast = q === total - 1;

  $('#app').innerHTML = `
    <div class="screen" style="--accent:${d.accent};--soft:${d.soft};">
      <div class="xpfloat">⭐ ${state.xp}</div>
      <div class="prog-label">
        <span>Day ${day+1} · ${esc(d.theme)}</span>
        <span>Step ${q+1} of ${total} (${Math.round((q+1)/total*100)}%)</span>
      </div>
      <div class="scale-row" style="height:8px;background:#e0d8c8;border-radius:99px;overflow:hidden;margin:0 0 16px;max-width:none;">
        <div style="height:100%;width:${(q+1)/total*100}%;background:${d.accent};border-radius:99px;transition:width 0.3s;"></div>
      </div>
      <div class="gentle">${esc(d.gentle)}</div>
      <h2 class="screen-title">${esc(Q.text)}</h2>
      <div id="optBox">${renderOpts(Q, prev)}</div>
      <div class="nav-row" style="margin-top:14px;">
        <button class="btn btn-ghost" id="backBtn">← Roadmap</button>
        <button class="btn ${isLast ? 'btn-accent' : 'btn-primary'}" id="nextBtn" ${prev === undefined || prev === null || prev === '' ? 'disabled' : ''}>${isLast ? 'Complete Session ✓' : 'Next Step →'}</button>
      </div>
    </div>`;

  $('#backBtn').onclick = () => { view = null; render(); };
  
  const next = $('#nextBtn');
  next.onclick = () => {
    if(isLast) {
      view = { kind: 'result', day };
    } else {
      currentStep++;
      view = { kind: 'q', day };
    }
    render();
  };

  bindOpts(day, q, next);
}

function renderOpts(Q, prev) {
  if (Q.type === 'TF') {
    return `
      <button class="option-btn ${prev===true?'selected':''}" data-v="true">Yes, that rings true <span class="check">✓</span></button>
      <button class="option-btn ${prev===false?'selected':''}" data-v="false">Not really for me <span class="check">✓</span></button>
      <button class="option-btn ${prev==='skip'?'selected':''}" data-v="skip" style="color:var(--ink-soft);font-style:italic;">I am not sure / Skip <span class="check">✓</span></button>`;
  }
  if (Q.type === 'SL') {
    let b = '';
    for(let i=1; i<=5; i++) {
      b += `<button class="scale-btn ${prev===i?'selected':''}" data-v="${i}">${i}</button>`;
    }
    return `
      <div class="scale-row">${b}</div>
      <div class="scale-ends"><span>${esc(Q.low)}</span><span>${esc(Q.high)}</span></div>`;
  }
  if (Q.type === 'SC') {
    let html = Q.options.map((o, i) => `
      <button class="option-btn ${prev===i?'selected':''}" data-i="${i}">${esc(o)} <span class="check">✓</span></button>
    `).join('');
    html += `<button class="option-btn ${prev==='skip'?'selected':''}" data-i="skip" style="color:var(--ink-soft);font-style:italic;">Skip / Pass on this <span class="check">✓</span></button>`;
    return html;
  }
  if (Q.type === 'MS') {
    const cur = Array.isArray(prev) ? prev : [];
    let html = Q.options.map((o, i) => `
      <button class="option-btn ${cur.includes(i)?'selected':''}" data-i="${i}">${esc(o)} <span class="check">✓</span></button>
    `).join('');
    html += `<textarea class="custom-input" id="customInput" placeholder="Or type your own custom thought here...">${typeof prev==='string'?prev:''}</textarea>`;
    return html;
  }
  if (Q.type === 'TIMER') {
    return `
      <div class="interactive-box">
        <p style="font-size:13px;color:var(--ink-soft);">Interactive Micro-Pause</p>
        <div class="timer-display" id="timerDisplay">01:00</div>
        <button class="spin-btn" id="startTimerBtn">Start 60s Pause</button>
      </div>`;
  }
  if (Q.type === 'SPIN') {
    return `
      <div class="interactive-box">
        <p style="font-size:13px;color:var(--ink-soft);">Tap to randomize & select an option</p>
        <div id="spinResultBox" style="font-weight:800;font-size:16px;margin:12px 0;min-height:40px;display:flex;align-items:center;justify-content:center;color:var(--accent);">
          ${prev || 'Tap the button below ↓'}
        </div>
        <button class="spin-btn" id="spinWheelBtn">🎲 Tap to Reveal</button>
      </div>`;
  }
  if (Q.type === 'RK') {
    return `
      <textarea class="custom-input" id="textResponseInput" placeholder="Type a brief, honest note here (optional or skip)..." style="height:110px;">${prev || ''}</textarea>
      <div style="margin-top:8px;text-align:right;"><button class="btn btn-ghost" id="skipTextBtn" style="font-size:11px;padding:4px 8px;">Skip this note</button></div>`;
  }
  return '';
}

function bindOpts(day, q, nextBtn) {
  const Q = WEEK_DATA[day].qs[q];
  const setAns = val => {
    if(!state.answers[day]) state.answers[day] = {};
    state.answers[day][q] = val;
    saveState();
    nextBtn.disabled = false;
  };

  const box = $('#optBox');

  if (Q.type === 'TF' || Q.type === 'SC') {
    box.querySelectorAll('.option-btn').forEach(btn => {
      btn.onclick = () => {
        box.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const val = btn.dataset.i !== undefined ? (btn.dataset.i === 'skip' ? 'skip' : +btn.dataset.i) : (btn.dataset.v === 'skip' ? 'skip' : btn.dataset.v === 'true');
        setAns(val);
      };
    });
  } else if (Q.type === 'SL') {
    box.querySelectorAll('.scale-btn').forEach(btn => {
      btn.onclick = () => {
        box.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        setAns(+btn.dataset.v);
      };
    });
  } else if (Q.type === 'MS') {
    box.querySelectorAll('.option-btn').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('selected');
        const selectedIndices = Array.from(box.querySelectorAll('.option-btn.selected')).map(b => +b.dataset.i);
        setAns(selectedIndices);
      };
    });
    const customTxt = $('#customInput');
    if(customTxt) {
      customTxt.oninput = () => { setAns(customTxt.value); };
    }
  } else if (Q.type === 'TIMER') {
    let timerInterval;
    const startBtn = $('#startTimerBtn');
    const display = $('#timerDisplay');
    let timeLeft = 60;
    startBtn.onclick = () => {
      startBtn.disabled = true;
      startBtn.textContent = "Pausing...";
      timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60).toString().padStart(2,'0');
        let s = (timeLeft%60).toString().padStart(2,'0');
        display.textContent = `${m}:${s}`;
        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          display.textContent = "✨ Done";
          startBtn.textContent = "Completed Pause";
          setAns('completed_timer');
        }
      }, 1000);
    };
    setTimeout(() => { setAns('timer_skipped_or_done'); }, 500);
  } else if (Q.type === 'SPIN') {
    const spinBtn = $('#spinWheelBtn');
    const resBox = $('#spinResultBox');
    spinBtn.onclick = () => {
      let counter = 0;
      const opts = Q.options;
      spinBtn.disabled = true;
      const roll = setInterval(() => {
        resBox.textContent = opts[counter % opts.length];
        counter++;
        if(counter > 12) {
          clearInterval(roll);
          const chosen = opts[Math.floor(Math.random() * opts.length)];
          resBox.textContent = "✨ " + chosen;
          spinBtn.textContent = "Tap again";
          spinBtn.disabled = false;
          setAns(chosen);
        }
      }, 80);
    };
  } else if (Q.type === 'RK') {
    const txtInput = $('#textResponseInput');
    if(txtInput) {
      txtInput.oninput = () => { setAns(txtInput.value); };
    }
    const skipBtn = $('#skipTextBtn');
    if(skipBtn) {
      skipBtn.onclick = () => { setAns('Skipped note'); nextBtn.disabled = false; };
    }
  }
}

function renderResult(day) {
  const d = WEEK_DATA[day];
  if(!state.completed[day]) {
    state.completed[day] = true;
    state.xp += 15;
    saveState();
  }

  $('#app').innerHTML = `
    <div class="screen" style="--accent:${d.accent};--soft:${d.soft};">
      <div class="xpfloat">⭐ ${state.xp}</div>
      <div class="eyebrow">Day ${day+1} · Session Complete</div>
      <div class="insight-card">
        <div class="insight-title">Day ${day+1} Micro-Exercises Completed 🌟</div>
        <p class="insight-text">You completed all micro-exercises for Day ${day+1}. Every response builds your personal behavioral awareness without pressure or judgment.</p>
        <div class="divider"></div>
        <p class="insight-text"><b>SWA Core Insight:</b> Action is an experiment, not a performance grade[cite: 3].</p>
      </div>
      <div class="nav-row" style="margin-top:20px;">
        <button class="btn btn-ghost" id="backRoadmap">← Back to Roadmap</button>
        <button class="btn btn-accent" id="nextDayBtn">${day < 6 ? 'Proceed to Day ' + (day+2) + ' →' : 'Finish Journey 🏆'}</button>
      </div>
    </div>`;

  $('#backRoadmap').onclick = () => { view = null; render(); };
  $('#nextDayBtn').onclick = () => {
    if(day < 6) {
      currentDay = day + 1;
      currentStep = 0;
      view = { kind: 'q', day: currentDay };
    } else {
      view = null;
    }
    render();
  };
}

render();
</script>
</body>
</html>
