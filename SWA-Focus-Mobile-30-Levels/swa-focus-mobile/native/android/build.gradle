buildscript { repositories { google(); mavenCentral() } }
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react { jsRootDir = file('../../src/native'); libraryName = 'SwaFocusSpec'; codegenJavaPackageName = 'com.swafocus' }
android {
  namespace 'com.swafocus'
  compileSdk (rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36)
  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets { main { java.srcDirs += ['src/main/java']; jniLibs.srcDirs = ['src/main/jniLibs'] } }
}
repositories { google(); mavenCentral() }
dependencies { implementation 'com.facebook.react:react-android'; implementation 'net.java.dev.jna:jna:5.17.0@aar' }
