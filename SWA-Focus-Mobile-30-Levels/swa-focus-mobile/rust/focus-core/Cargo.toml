[package]
name = "focus-core"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "focus_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
getrandom = { version = "0.2.16", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.29.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
web-sys = { version = "=0.3.82", features = ["Window", "Performance"] }

[features]
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin.rs"
required-features = ["bindgen-cli"]

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
